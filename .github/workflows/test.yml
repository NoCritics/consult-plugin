# Runs consult's free, offline tests on Linux, macOS and Windows.
# The paid tests (live, chat, council, image) need signed-in CLIs and never run here.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DISABLE_TELEMETRY: '1'
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'

jobs:
  server:
    name: server (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: macos-latest, node: 22 }
          - { os: windows-latest, node: 22 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # No npm install: the server runs from the bundled SDK, as it does for users.
      - name: npm test
        working-directory: mcp
        run: npm test

  mod:
    name: mod (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Pinned so an engine update can't turn the run red on its own; raise it deliberately.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.314
      - name: claude plugin validate
        run: claude plugin validate .
      - name: claude plugin test
        run: claude plugin test .
